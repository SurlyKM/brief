name: Update feed

on:
  schedule:
    # Twice a day. Times are UTC: 20:00 and 08:00 are about 7am and 7pm in Sydney (AEDT).
    - cron: "0 20 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:        # also lets you run it by hand from the Actions tab
    inputs:
      weekly_week:
        description: "Optional: write the weekly issue for the week containing this date (YYYY-MM-DD), e.g. today for a preview"
        required: false
        default: ""

permissions:
  contents: write           # needed to commit the updated data files

concurrency:
  group: update-feed        # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and process
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: python -m pipeline.main

      # Writes last week's issue on the first run each Monday (Sydney); a no-op otherwise.
      - name: Weekly issue
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          FEED_DISCORD_WEBHOOK: ${{ secrets.FEED_DISCORD_WEBHOOK }}
          WEEK: ${{ github.event.inputs.weekly_week }}
        run: |
          if [ -n "$WEEK" ]; then
            python -m pipeline.weekly --week "$WEEK"
          else
            python -m pipeline.weekly
          fi

      - name: Commit changes
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update feed"
            git push
          fi
